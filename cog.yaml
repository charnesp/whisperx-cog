build:
  # cog_runtime: true  # disabled: new runtime (coglet) only allows str/int/float/bool/Path/List in Output, not dict/list[dict]
  # CUDA 12.8 = the CUDA the torch wheel is built for (cu128). With 12.5, torch
  # installed its own 12.8 runtime as nvidia-* pip wheels on top of a 12.5 base:
  # CUDA was shipped twice (4.5 GB base + 3.06 GB of wheels, measured 2026-10-30).
  cuda: "12.8"
  gpu: true
  system_packages:
    - "gnupg"
    - "curl"
    - "wget"
  python_version: "3.13"
  python_requirements: requirements.txt
  run:
    # FFmpeg 6 (libavutil58) for torchcodec/pyannote — do not add ffmpeg to system_packages
    # (default Ubuntu apt ships an older ffmpeg; PPA install below is the only ffmpeg we want)
    - curl -sSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF4E48910A020E77056748B745738AE8480447DDF" | gpg --dearmor -o /usr/share/keyrings/ubuntuhandbook1-ffmpeg6.gpg
    - echo "deb [signed-by=/usr/share/keyrings/ubuntuhandbook1-ffmpeg6.gpg] http://ppa.launchpad.net/ubuntuhandbook1/ffmpeg6/ubuntu jammy main" > /etc/apt/sources.list.d/ubuntuhandbook1-ffmpeg6.list
    - apt-get update -qq && apt-get install -qqy --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
    # Image diet (docs/IMAGE_SIZE.md): the 12.8 base already provides cublas,
    # cudnn, cusparse, cusolver, cufft, curand, nccl, nvrtc, nvtx, cupti. The diet
    # drops the duplicate wheels plus triton and torch's headers/tests, and keeps
    # the two wheels the base lacks (cusparselt, cufile) — it aborts loudly if
    # either is missing, because libtorch_{python,cuda}.so need them at import.
    # The source tree is NOT in the image when run steps execute (measured 2026-10-31:
    # "/src/scripts/image_diet.py: No such file or directory"), so the diet runs from
    # an inline copy. A contract test compares this block byte for byte with
    # scripts/image_diet.py: the tested file IS the executed code.
    - |
      python3 - <<'PY'
      #!/usr/bin/env python3
      """Post-install diet: drop from the image what the runtime never loads.

      Why
      ---
      The Cog base image already installs CUDA 12.8 for the whole stack (cudart,
      cublas, cudnn, cusparse, cusolver, cufft, curand, nccl, nvrtc, nvtx, cupti).
      torch's PyPI wheel declares the same libraries again as `nvidia-*` pip
      packages, so the image carried CUDA twice: 3.06 GB of duplicated wheels on top
      of a 4.5 GB CUDA base (measured 2026-10-30 on ghcr.io/charnesp/whisperx-cog).

      What is removed
      ---------------
      - `nvidia/*` wheels the base already provides. Their absence is safe because
        the wheels are the same CUDA major.minor as the base image (12.8): torch
        resolves the libraries from the base through the loader cache.
      - `triton`: only used by torch.compile, which this service never calls.
      - `torch/include` and `torch/test`: headers and the test suite of torch, never
        used at runtime.
      - the `.dist-info` of every removed package, so the environment does not
        advertise packages that are gone.

      What is KEPT, and why it is checked
      ----------------------------------
      `nvidia/cusparselt` and `nvidia/cufile` are NOT in the base image, but
      libtorch_python.so needs libcusparseLt.so.0 and libtorch_cuda.so needs
      libcufile.so.0 at import time (readelf -d, 2026-10-31). Removing them breaks
      `import torch`. Their absence therefore aborts the build instead of shipping a
      broken image.

      Usage
      -----
          python3 scripts/image_diet.py                      # simulation
          python3 scripts/image_diet.py --apply              # suppression
          python3 scripts/image_diet.py --site-packages /path --apply --json
      """

      from __future__ import annotations

      import argparse
      import json
      import shutil
      import sysconfig
      import sys
      from pathlib import Path

      # Duplicated by the Cog base image (cog-base:cuda12.8): safe to drop.
      REMOVE_NVIDIA = (
          "cublas",
          "cuda_cupti",
          "cuda_nvrtc",
          "cuda_runtime",
          "cudnn",
          "cufft",
          "curand",
          "cusolver",
          "cusparse",
          "nccl",
          "nvjitlink",
          "nvtx",
      )

      # Absent from the base image and needed at import: never remove.
      KEEP_NVIDIA = ("cusparselt", "cufile")

      REMOVE_PACKAGES = ("triton",)
      REMOVE_TORCH_SUBDIRS = ("include", "test")


      def _size(path: Path) -> int:
          if path.is_file():
              return path.stat().st_size
          return sum(p.stat().st_size for p in path.rglob("*") if p.is_file())


      def _dist_infos(site: Path, name: str) -> list[Path]:
          """dist-info directories of a pip package, whatever its name flavour."""
          patterns = (f"nvidia_{name}_cu12-*.dist-info", f"nvidia-{name}-*.dist-info",
                      f"{name}-*.dist-info")
          found: list[Path] = []
          for pattern in patterns:
              found.extend(sorted(site.glob(pattern)))
          return found


      def plan(site: Path) -> dict:
          """Compute what to remove. Raises before touching anything if unsafe."""
          if not site.is_dir():
              raise FileNotFoundError(f"site-packages introuvable: {site}")

          nvidia = site / "nvidia"
          missing_kept = [name for name in KEEP_NVIDIA if not (nvidia / name).is_dir()]
          if missing_kept:
              raise RuntimeError(
                  "roue(s) indispensable(s) absente(s) de " + str(nvidia) + ": "
                  + ", ".join(missing_kept)
                  + " — libtorch_python.so / libtorch_cuda.so en ont besoin a l'import ; "
                  "refus de produire une image cassee"
              )

          targets: list[Path] = []
          for name in REMOVE_NVIDIA:
              d = nvidia / name
              if d.is_dir():
                  targets.append(d)
                  targets.extend(_dist_infos(site, name))
          for name in REMOVE_PACKAGES:
              d = site / name
              if d.is_dir():
                  targets.append(d)
                  targets.extend(_dist_infos(site, name))
          for sub in REMOVE_TORCH_SUBDIRS:
              d = site / "torch" / sub
              if d.is_dir():
                  targets.append(d)

          kept = sorted(p.name for p in nvidia.iterdir() if p.is_dir()) if nvidia.is_dir() else []
          return {
              "site_packages": str(site),
              "targets": sorted(set(targets)),
              "kept_nvidia": kept,
              "bytes": sum(_size(t) for t in set(targets)),
          }


      def apply(item: dict) -> dict:
          removed = 0
          for target in item["targets"]:
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
              removed += 1
          return {
              "removed_dirs": removed,
              "removed_bytes": item["bytes"],
              "removed_mb": round(item["bytes"] / 1e6, 1),
              "kept_nvidia": item["kept_nvidia"],
          }


      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(description="allege l'image apres installation")
          parser.add_argument(
              "--site-packages",
              default=None,
              help="repertoire site-packages (defaut: celui de l'interpreteur courant)",
          )
          parser.add_argument("--apply", action="store_true", help="supprime (defaut: simulation)")
          parser.add_argument("--json", action="store_true", help="rapport JSON sur stdout")
          args = parser.parse_args(argv)

          site = Path(args.site_packages) if args.site_packages else Path(
              sysconfig.get_paths()["purelib"])
          try:
              item = plan(site)
          except (FileNotFoundError, RuntimeError) as exc:
              print(f"ECHEC: {exc}", file=sys.stderr)
              return 2

          if not args.apply:
              if args.json:
                  print(json.dumps({"targets": [str(t) for t in item["targets"]],
                                    "bytes": item["bytes"], "applied": False}, indent=2))
              else:
                  for target in item["targets"]:
                      print(f"a supprimer: {target}")
                  print(f"total: {item['bytes'] / 1e6:.1f} Mo")
              return 0

          result = apply(item)
          result["applied"] = True
          if args.json:
              print(json.dumps(result, indent=2))
          else:
              print(f"supprime: {result['removed_dirs']} entrees, "
                    f"{result['removed_mb']} Mo liberes ; conserve: "
                    + ", ".join(result["kept_nvidia"]))
          return 0


      if __name__ == "__main__":
          raise SystemExit(main())
      PY
    # The loader must find the base CUDA libraries once torch's own copies are
    # gone. An `environment: LD_LIBRARY_PATH=...` entry is refused by cog
    # ("environment variable is not allowed"), hence the loader configuration file.
    - printf '/usr/local/cuda/lib64\n/usr/lib/x86_64-linux-gnu\n' > /etc/ld.so.conf.d/zz-cuda-runtime.conf && ldconfig
    # Build-time guard: the diet removed libraries, so prove the import chain still
    # loads (no GPU needed: the point is the loader, not the device).
    - python3 -c "import torch, faster_whisper, qwen_asr; assert torch.__version__.startswith('2.8'), torch.__version__; print('import ok', torch.__version__, torch.version.cuda)"
    # Build toolchain: needed to compile Python (pyenv) and the wheels, never at
    # runtime. No autoremove after the purge: it could cascade into CUDA packages.
    - apt-get purge -y --no-install-recommends build-essential gcc g++ make libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libncurses5-dev libncursesw5-dev tk-dev libffi-dev liblzma-dev xz-utils && apt-get clean && rm -rf /var/lib/apt/lists/*
    # E5 canary decision: NO weight baking. /models is a host bind mount
    # provisioned by scripts/provision.py against models.lock v2 (sha256 per
    # file). Weights stay out of the image; code + runtime measured at 9.40 GB on
    # 2026-10-30, of which 3.06 GB was duplicated CUDA removed by the diet above.
    # VAD is bundled in whisperx>=3.2 (whisperx/assets/pytorch_model.bin) — nothing
    # to provision, arrives via pip.
environment:
  # No offline flags (E5-LEGACY-HF): HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE
  # blocked the only legitimate network call — the gated pyannote download
  # on diarize (first run). Provisioned models are resolved from /models by
  # model_paths; anything missing downloads from HF with the container token.
  - "PYTORCH_SKIP_CUDNN_COMPATIBILITY_CHECK=1"
predict: "predict.py:Predictor"
