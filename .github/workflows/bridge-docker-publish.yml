# Build the bridge Docker image and push to GitHub Container Registry (GHCR)
# Package: ghcr.io/charnesp/whisperx-cog-bridge
#
# Tags calculés par scripts/compute_image_tags.sh (contrat partagé avec
# docker-publish.yml / provisioner-docker-publish.yml): sha-<short8>, canary,
# tag de branche feat/** et :latest UNIQUEMENT en égalité exacte
# refs/heads/main | refs/heads/master. Jamais de :latest hors main.

name: Build and push bridge image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags (compute_image_tags.sh — garde :latest main/master exact)
        run: |
          IMAGE="ghcr.io/charnesp/whisperx-cog-bridge"
          eval "$(IMAGE="$IMAGE" bash scripts/compute_image_tags.sh)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"

      - name: Build bridge image
        run: docker build --progress=plain -t ${{ env.IMAGE }}:${{ github.sha }} ./bridge

      - name: Tag image (computed TAGS)
        run: |
          for tag in $TAGS; do
            docker tag ${{ env.IMAGE }}:${{ github.sha }} "$tag"
          done

      - name: Push image to GHCR (computed TAGS)
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done