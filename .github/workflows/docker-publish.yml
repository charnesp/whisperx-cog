# Build the Cog Docker image and push to GitHub Container Registry (GHCR)
# https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
#
# T7 (plan E5 §4): buildable depuis feat/qwen3-asr-backend sans merge.
# Tags: sha-<short8> (immuable, pin compose), canary, feat-qwen3-asr-backend.
# :latest UNIQUEMENT depuis main/master (jamais depuis une branche).

name: Build and push Docker image

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          docker system prune -af || true
          df -h

      - name: Compute tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          MAIN_SHA="${GITHUB_REF::12}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAGS="$IMAGE:sha-$SHORT_SHA $IMAGE:canary"
          if [ "$MAIN_SHA" = "refs/heads/m" ]; then
            TAGS="$TAGS $IMAGE:latest"
          fi
          if [ "${GITHUB_REF_NAME}" = "feat/qwen3-asr-backend" ]; then
            TAGS="$TAGS $IMAGE:feat-qwen3-asr-backend"
          fi
          {
            echo "IMAGE=$IMAGE"
            echo "TAGS=$TAGS"
            echo "IS_MAIN=$([ "$MAIN_SHA" = "refs/heads/m" ] && echo true || echo false)"
            echo "SHORT_SHA=$SHORT_SHA"
          } >> "$GITHUB_ENV"

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ""  # do not authenticate to Replicate; we only push to GHCR
          cog-version: "v0.16.12"

      # Use default builder (docker driver) so the image is loaded locally for docker push
      - name: Use default Docker builder
        run: docker buildx use default

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with Cog
        run: cog build --progress=plain -t ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}

      - name: Tag additional refs (latest=false hors main)
        run: |
          for t in $TAGS; do
            docker tag "$IMAGE:sha-$SHORT_SHA" "$t"
          done
          echo "Tags computed: $TAGS"

      - name: Push image to GHCR
        run: |
          for t in $TAGS; do
            docker push "$t"
          done