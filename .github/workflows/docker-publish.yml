# Build the Cog Docker image and push to GitHub Container Registry (GHCR)
# https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
#
# T7 (plan E5 §4): buildable depuis feat/qwen3-asr-backend sans merge.
# Tags: sha-<short8> (immuable, pin compose), canary, feat-qwen3-asr-backend.
# :latest UNIQUEMENT depuis main/master (jamais depuis une branche).

name: Build and push Docker image

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          docker system prune -af || true
          df -h

      - name: Compute tags
        # Calcul des tags délégué à scripts/compute_image_tags.sh (testable
        # unitairement, revue T7+T4b): garde :latest en égalité exacte
        # refs/heads/main / refs/heads/master — jamais de prefix-match.
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          eval "$(IMAGE="$IMAGE" bash scripts/compute_image_tags.sh)"
          # Persister les variables aux steps suivants (eval ne survit pas au step)
          printf 'IMAGE=%s\nTAGS=%s\nIS_DEFAULT_BRANCH=%s\nSHORT_SHA=%s\n' \
            "$IMAGE" "$TAGS" "$IS_DEFAULT_BRANCH" "$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ""  # do not authenticate to Replicate; we only push to GHCR
          cog-version: "v0.16.12"

      # Use default builder (docker driver) so the image is loaded locally for docker push
      - name: Use default Docker builder
        run: docker buildx use default

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with Cog
        run: cog build --progress=plain -t ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}

      - name: Tag additional refs (sha-/canary/feat ; :latest si main/master exact)
        run: |
          for t in $TAGS; do
            docker tag "$IMAGE:sha-$SHORT_SHA" "$t"
          done
          echo "Tags computed: $TAGS"

      - name: Push image to GHCR
        run: |
          for t in $TAGS; do
            docker push "$t"
          done