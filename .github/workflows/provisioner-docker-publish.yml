# Provisioner image CI (T4b, plan E5 §2.2): build/push ghcr.io/charnesp/whisperx-provisioner
# Déclenché par modification de scripts/provision.py (et workflow_dispatch).
# Tags: sha-<short8> immuable + feat-qwen3-asr-backend sur la branche; :latest UNIQUEMENT main.

name: Build and push provisioner image

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
    paths:
      - "scripts/provision.py"
      - "Dockerfile.provisioner"
      - "models.lock"
      - ".github/workflows/provisioner-docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/charnesp/whisperx-provisioner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="ghcr.io/charnesp/whisperx-provisioner"
          TAGS="$IMAGE:sha-$SHORT_SHA"
          if [ "${GITHUB_REF_NAME}" = "feat/qwen3-asr-backend" ]; then
            TAGS="$TAGS $IMAGE:feat-qwen3-asr-backend"
          fi
          if [ "${GITHUB_REF::12}" = "refs/heads/m" ]; then
            TAGS="$TAGS $IMAGE:latest"
          fi
          {
            echo "TAGS=$TAGS"
            echo "SHORT_SHA=$SHORT_SHA"
            echo "IS_MAIN=$([ "${GITHUB_REF::12}" = "refs/heads/m" ] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push provisioner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.provisioner
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max