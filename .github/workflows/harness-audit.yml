name: Harness audit

on:
  pull_request:
  push:
    branches:
      - main
      - master
    paths:
      - "models.lock"
      - "scripts/lock_audit.py"
      - ".github/workflows/harness-audit.yml"
      - "tests/**"
      - "scripts/**"
      - "Makefile.harness"
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pyyaml requests numpy ruff pip-audit)
        # numpy: four harness tests import it (qwen_split energy vectorisation,
        # qwen remote silence guard, quiet chunking, recovery budget). Absent
        # from this job until now, which made `make -f Makefile.harness ci`
        # fail on main from 2026-10-20 with ModuleNotFoundError: numpy.
        run: pip install pyyaml requests numpy ruff pip-audit

      - name: Run harness CI
        run: make -f Makefile.harness ci

  # E5 T5: models.lock is the single source of truth. This job fails the CI
  # on drift between models.lock and the live HF API (sha256/size/missing).
  # Uses the read-only GITHUB_TOKEN as HF token fallback (public repos).
  lock-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml requests

      - name: lock_audit --check (fail on drift)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/lock_audit.py --check